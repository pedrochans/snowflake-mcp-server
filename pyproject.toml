[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowflake-mcp-server"
version = "0.2.0"
description = "MCP server for performing read-only operations against Snowflake"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "snowflake-connector-python[secure-local-storage]>=4.6.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.0",
    "cryptography>=44.0.0",
    "mcp>=1.27.0",
    "anyio>=4.13.0",
    "sqlglot>=30.0.0",
    "pip-system-certs>=5.0"
]

[project.scripts]
snowflake-mcp = "snowflake_mcp_server.main:run_stdio_server"
snowflake-mcp-stdio = "snowflake_mcp_server.main:run_stdio_server"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # Ignore line too long errors

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# pip-system-certs ships no type stubs / py.typed marker; it is imported purely
# for its SSL side effect, so silence the missing-stubs noise.
[[tool.mypy.overrides]]
module = ["pip_system_certs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
